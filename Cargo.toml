[workspace]
resolver = "2"
members = [
    "core/protocol",
    "core/transport",
    "core/session",
    "core/pairing",
    "core/input",
    "core/diagnostics",
]
exclude = ["phone/android", "desktop"]

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
bytes = "1.0"
tokio = { version = "1.0", features = ["full", "macros", "rt-multi-thread"] }

# QUIC
quinn = "0.11"
quinn-proto = "0.11"
rustls = "0.23"
rcgen = "0.11"

# Windows
windows = { version = "0.58", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }

# Crypto
ring = "0.17"
ed25519-dalek = "2.0"
x25519-dalek = "2.0"
rand = "0.8"
zeroize = "1.0"

# Utils
uuid = { version = "1.0", features = ["v4", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
bitflags = "2.0"
mdns-sd = "0.10"
async-trait = "0.1"

# FFI
uniffi = { version = "0.27", features = ["serde"] }

[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1