[workspace]
resolver = "2"
members = [
    "core/protocol",
    "core/transport",
    "core/session",
    "core/pairing",
    "core/input",
    "core/diagnostics",
    "desktop/windows/input_adapter",
    "desktop/windows/agent",
]
exclude = ["phone/android"]

[workspace.dependencies]
# Core crates
pir_protocol = { path = "core/protocol" }
pir_transport = { path = "core/transport" }
pir_session = { path = "core/session" }
pir_pairing = { path = "core/pairing" }
pir_input = { path = "core/input" }
pir_diagnostics = { path = "core/diagnostics" }
pir_input_adapter = { path = "desktop/windows/input_adapter" }

# Core
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
bytes = "1.0"
tokio = { version = "1.0", features = ["full", "macros", "rt-multi-thread"] }

# QUIC
# ring only: compiling both ring and aws-lc leaves rustls without a default provider
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen = "0.11"

# Windows
windows = { version = "0.58", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }

# Crypto
ring = "0.17"
ed25519-dalek = "2.0"
x25519-dalek = "2.0"
rand = "0.8"
zeroize = "1.0"

# Utils
uuid = { version = "1.0", features = ["v4", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
bitflags = { version = "2.0", features = ["serde"] }
mdns-sd = "0.10"
async-trait = "0.1"
base64 = "0.22"
hex = "0.4"
parking_lot = "0.12"

# FFI
uniffi = { version = "0.27" }

[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1