[package]
name = "pir_mobile"
version = "0.1.0"
edition = "2021"
description = "Phone Input Relay - UniFFI bridge for the mobile apps"

[lib]
name = "pir_mobile"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
pir_protocol = { workspace = true }
pir_transport = { workspace = true }
pir_input = { workspace = true }
pir_session = { workspace = true }
pir_pairing = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
uniffi = { workspace = true }

[dev-dependencies]
pir_protocol = { workspace = true }
tempfile = "3"
# The real desktop agent, for the end-to-end pairing tests.
pir_agent = { path = "../../desktop/windows/agent" }
pir_input_adapter = { workspace = true }
